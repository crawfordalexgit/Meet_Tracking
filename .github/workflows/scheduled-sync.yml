name: Scheduled SCM sync

# Vercel Hobby allows 2 cron jobs, daily only, with a ~60s function limit. The
# SCM syncs scrape a page per swimmer, so they run here instead: this workflow
# calls the production API in small batches, none of which runs long.
#
# Rankings stay a manual job (scripts/scrape-rankings.js) so the Supabase
# service-role key is not needed here — CRON_SECRET is the only secret required.

on:
  schedule:
    # 03:00 UTC daily — after the Vercel attendance cron at 02:00.
    - cron: '0 3 * * *'
    # 04:00 UTC on the 1st — join dates change rarely.
    - cron: '0 4 1 * *'
  workflow_dispatch:
    inputs:
      job:
        description: Which sync to run
        required: true
        default: memberships
        type: choice
        options: [memberships, join-dates]

concurrency:
  group: scheduled-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APP_URL: https://www.coacheseye.co.uk
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      # Decide which job this run should do. A manual run uses the chosen input;
      # the monthly schedule does join dates; anything else is the daily sync.
      - id: pick
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "job=${{ inputs.job }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "0 4 1 * *" ]; then
            echo "job=join-dates" >> "$GITHUB_OUTPUT"
          else
            echo "job=memberships" >> "$GITHUB_OUTPUT"
          fi

      - name: Check CRON_SECRET is configured
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET repo secret is not set — add it under Settings > Secrets and variables > Actions."
            exit 1
          fi

      # Fail fast with a clear cause rather than mid-run: a 404 means the
      # deployment is older than this commit, a 401 means the secret is wrong.
      - name: Check deployment is up to date
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $CRON_SECRET" "$APP_URL/api/sync-targets")
          if [ "$code" = "404" ]; then
            echo "$APP_URL/api/sync-targets returned 404 — the deployment is older than this commit."
            echo "Wait for Vercel to finish deploying, then re-run. Nothing has been changed."
            exit 1
          elif [ "$code" = "401" ]; then
            echo "$APP_URL/api/sync-targets returned 401 — CRON_SECRET here does not match the deployment."
            exit 1
          elif [ "$code" != "200" ]; then
            echo "$APP_URL/api/sync-targets returned HTTP $code."
            exit 1
          fi
          echo "Deployment is current."

      - name: Run sync
        run: node scripts/drive-sync.mjs "${{ steps.pick.outputs.job }}"
